[package]
name = "voxelport-core"
version = "0.1.0"
edition = "2021"
description = "VoxelPort's native core: managed Minecraft server process, log buffering, argument validation, account gate. No UI code."
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time", "net"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sha1 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
unicode-normalization = "0.1"
url = "2"
# The relay WebSocket (TLS through the same rustls build the HTTP client uses) and its stream helpers.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Zip reading (and, in tests, writing) for the Java archive; pure Rust, no system zlib.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Blocking HTTP client, run on a worker thread. Redirects are switched off per request, as Electron's fetch did.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tempfile = "3"

# A stand-in for a Minecraft server, used only by the tests (it speaks just enough of the console protocol).
[[bin]]
name = "vp-fake-server"
path = "src/bin/fake_server.rs"
test = false
