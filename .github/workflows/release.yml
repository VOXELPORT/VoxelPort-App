name: Build & Release App

on:
  push:
    tags:
      - 'v*'   # v1.0.2, v1.1.0, ...

permissions:
  contents: write   # create GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win -- --publish never
            files: |
              release/VoxelPort-Setup.exe
              release/VoxelPort-Setup.exe.blockmap
              release/VoxelPort-Portable.exe
              release/latest.yml
          - os: ubuntu-latest
            build: npm run dist:linux -- --publish never
            files: |
              release/VoxelPort-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (${{ matrix.os }})
        run: ${{ matrix.build }}

      - name: Upload built artifacts (for checksum step)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.files }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum *.exe *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish complete app release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoxelPort App ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/VoxelPort-Setup.exe
            artifacts/VoxelPort-Setup.exe.blockmap
            artifacts/VoxelPort-Portable.exe
            artifacts/latest.yml
            artifacts/VoxelPort-Linux.tar.gz
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish after all assets have uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Delete older releases (keep only the newest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$RELEASE_TAG" ] && continue
            gh release delete "$tag" --yes
          done
