[workspace]
members = ["crates/voxelport-core", "src-tauri"]
resolver = "2"

# Size and startup first: the point of the migration is a light app.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Tests run PBKDF2 with 600,000 rounds; unoptimised crypto would make them crawl.
[profile.dev.package."*"]
opt-level = 3
