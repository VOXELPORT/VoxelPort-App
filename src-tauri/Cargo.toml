[package]
name = "voxelport-tauri"
version = "0.1.0"
edition = "2021"
description = "VoxelPort desktop (Tauri v2 + Rust migration build)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
voxelport-core = { path = "../crates/voxelport-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
