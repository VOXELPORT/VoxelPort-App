[package]
name = "voxelport-tauri"
version = "2.0.0-beta.1"
edition = "2021"
description = "VoxelPort desktop (Tauri v2 + Rust migration build)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
getrandom = "0.2"
url = "2"
tokio = { version = "1", features = ["time", "sync"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
rfd = "0.15"
voxelport-core = { path = "../crates/voxelport-core" }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Time", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_Packaging_Appx"] }
